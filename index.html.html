<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCHIVE LOOKBOOK - 2026</title>
    <style>
        /* 미니멀리즘을 위한 기본 폰트 및 리셋 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff; /* 자라 스타일의 깨끗한 화이트 */
            color: #000000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* 헤더 디자인: 릭오웬스 & 자라 특유의 정갈한 로고 배치 */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid #f0f0f0;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
        }

        nav a {
            text-decoration: none;
            color: #000;
            font-size: 0.75rem;
            margin-left: 30px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
        }

        /* 룩북 메인 섹션 */
        .container {
            padding: 120px 20px 60px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 0.8rem;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #666;
        }

        /* 그리드 시스템: 세로로 긴 이미지 비율 유지 */
        .lookbook-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }

        .lookbook-item {
            position: relative;
            overflow: hidden;
            aspect-ratio: 2 / 3;
            background-color: #f7f7f7;
        }

        .lookbook-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lookbook-item:hover img {
            transform: scale(1.03);
        }

        .item-caption {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            mix-blend-mode: difference; /* 배경에 따라 텍스트 색상 반전 */
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            opacity: 0.8;
        }

        /* 푸터: 릭오웬스 스타일의 다크 포인트 */
        footer {
            padding: 100px 40px 40px;
            background-color: #000;
            color: #fff;
            text-align: center;
        }

        .footer-logo {
            font-size: 1.5rem;
            letter-spacing: 0.5em;
            margin-bottom: 20px;
        }

        .copyright {
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            color: #555;
        }

        /* 반응형 모바일 설정 */
        @media (max-width: 768px) {
            .lookbook-grid {
                grid-template-columns: 1fr 1fr;
                gap: 5px;
            }
            header { padding: 0 20px; }
            .logo { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ARCHIVE</div>
        <nav>
            <a href="#">New Arrivals</a>
            <a href="#">Collection</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="container">
        <div class="section-title">Spring Summer 2026 Editorial</div>
        
        <div class="lookbook-grid">
            <!-- 01 -->
            <div class="lookbook-item">
                <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1976&auto=format&fit=crop" alt="Look 01">
                <div class="item-caption">LOOK 01 - MONOCHROME EDITION</div>
            </div>
            <!-- 02 -->
            <div class="lookbook-item">
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1920&auto=format&fit=crop" alt="Look 02">
                <div class="item-caption">LOOK 02 - AVANT GARDE</div>
            </div>
            <!-- 03 -->
            <div class="lookbook-item">
                <img src="https://images.unsplash.com/photo-1539109132314-34755249ff95?q=80&w=1974&auto=format&fit=crop" alt="Look 03">
                <div class="item-caption">LOOK 03 - MINIMALISM</div>
            </div>
            <!-- 04 -->
            <div class="lookbook-item">
                <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=2070&auto=format&fit=crop" alt="Look 04">
                <div class="item-caption">LOOK 04 - STRUCTURED</div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-logo">ARCHIVE</div>
        <div class="copyright">© 2026 ARCHIVE ALL RIGHTS RESERVED.</div>
    </footer>

</body>
</html>
